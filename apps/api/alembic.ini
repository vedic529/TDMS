; TDMS Alembic configuration.
;
; NOTE: `sqlalchemy.url` is deliberately EMPTY. The real database URL contains
; the password and is supplied at runtime by alembic/env.py, which reads it from
; the application configuration (DATABASE_URL, or the TDMS_POSTGRES_* variables
; in the Git-ignored .env). No secret belongs in this committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

; Intentionally blank - see the note above.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
